<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Trade Journal v3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0f12;color:#e8eaf0;font-family:'Segoe UI',sans-serif;min-height:100vh}
input,select,textarea{background:#1a1e23;border:1px solid #2a2f38;border-radius:7px;color:#e8eaf0;font-family:monospace;font-size:13px;padding:9px 12px;outline:none;width:100%;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:#3a4050}
input[readonly]{background:#131619;color:#565c6e;cursor:default}
select option{background:#1a1e23}
textarea{resize:vertical;min-height:68px;line-height:1.55}
button{cursor:pointer;font-family:monospace;border-radius:8px;font-weight:600;letter-spacing:.04em;transition:opacity .15s}
button:disabled{opacity:.35;cursor:not-allowed}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#131619}
::-webkit-scrollbar-thumb{background:#2a2f38;border-radius:3px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<script>
// Suppress Babel in-browser transpiler notice (safe for personal use)
const _warn = console.warn.bind(console);
console.warn = (...args) => {
  if (args[0] && typeof args[0] === 'string' && args[0].includes('in-browser Babel')) return;
  _warn(...args);
};
</script>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef}=React;

// ── Constants ────────────────────────────────────────────────────
const RULES=[
  {t:"Valid setup present",           c:"structure",w:false},
  {t:"Bias aligned with trade dir",   c:"structure",w:false},
  {t:"5 min BOS confirmed",           c:"entry",    w:false},
  {t:"Liquidity sweep visible",       c:"entry",    w:false},
  {t:"LTF confirmation candle",       c:"entry",    w:false},
  {t:"Active killzone — LDN or NY",   c:"timing",   w:false},
  {t:"R:R at minimum 1:2",            c:"risk",     w:false},
  {t:"SL at structural invalidation", c:"risk",     w:false},
  {t:"Position within risk limit",    c:"risk",     w:false},
  {t:"No high-impact news (30 min)",  c:"news",     w:true },
  {t:"Spread within acceptable range",c:"broker",   w:true },
];
const SESSIONS=["Asian","London","New York","Overlap"];
const TFS=["M1","M5","M15","M30","H1","H4","D1","W1"];
const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SCRIPT=`function doGet(e){
  var p=e?e.parameter:{};
  if(p&&p.payload) return writeData(JSON.parse(decodeURIComponent(p.payload)));
  return ContentService.createTextOutput(JSON.stringify({status:"ok",msg:"connected"})).setMimeType(ContentService.MimeType.JSON);
}
function doPost(e){
  try{ return writeData(JSON.parse(e.postData.contents)); }
  catch(err){ return ContentService.createTextOutput(JSON.stringify({status:"error",msg:err.toString()})).setMimeType(ContentService.MimeType.JSON); }
}
function writeData(data){
  try{
    if(data.test) return ContentService.createTextOutput(JSON.stringify({status:"ok",msg:"connected"})).setMimeType(ContentService.MimeType.JSON);
    var ss=SpreadsheetApp.getActiveSpreadsheet();
    if(data.type==="trade"){
      var ts=ss.getSheetByName("TradeJournal");
      if(!ts){
        ts=ss.insertSheet("TradeJournal");
        ts.appendRow(["Date","Time IST","Pair","Direction","Bias","Order Type","Lot Size","Sessions","Timeframes","Strategy",
          "Planned Entry","Planned SL","Planned TP","Pre Notes","Checklist Score","Verdict","Override Reason",
          "C0","C1","C2","C3","C4","C5","C6","C7","C8","C9","C10",
          "Outcome","Actual Entry","Exit H1","Exit H2","Lots H1","Lots H2","P&L USD","Pips","R:R","Exit Type","Slippage","Post Notes","AI Insights"]);
      }
      ts.appendRow([data.date,data.timeIST,data.pair,data.direction,data.bias,data.orderType,data.lotSize,
        data.sessions,data.timeframes,data.strategy,data.sEntry,data.sSL,data.sTP,data.preNotes,
        data.checklistScore,data.verdict,data.overrideReason,
        data.c0,data.c1,data.c2,data.c3,data.c4,data.c5,data.c6,data.c7,data.c8,data.c9,data.c10,
        data.outcome,data.actualEntry,data.exit1,data.exit2,data.lots1,data.lots2,
        data.pnl,data.pips,data.rr,data.exitType,data.slippage,data.postNotes,data.aiInsights]);
    }
    if(data.type==="eod"){
      var ds=ss.getSheetByName("DailySummary");
      if(!ds){
        ds=ss.insertSheet("DailySummary");
        ds.appendRow(["Date","Total Trades","Wins","Losses","Breakevens","Risk Free",
          "Total P&L USD","Total P&L %","Total Pips","Avg R:R","Best Trade","Worst Trade","Balance After","Pairs Traded","Notes"]);
      }
      ds.appendRow([data.date,data.totalTrades,data.wins,data.losses,data.breakevens,data.riskFree,
        data.totalPnl,data.totalPct,data.totalPips,data.avgRR,data.bestTrade,data.worstTrade,data.balanceAfter,data.pairsTraded,data.eodNotes]);
    }
    return ContentService.createTextOutput(JSON.stringify({status:"ok"})).setMimeType(ContentService.MimeType.JSON);
  }catch(err){
    return ContentService.createTextOutput(JSON.stringify({status:"error",msg:err.toString()})).setMimeType(ContentService.MimeType.JSON);
  }
}`;

// ── Colours ──────────────────────────────────────────────────────
const K={
  bg:"#0d0f12",bg2:"#131619",bg3:"#1a1e23",bg4:"#212630",
  bd:"#2a2f38",bd2:"#3a4050",
  tx:"#e8eaf0",tx2:"#8b909e",tx3:"#565c6e",
  gr:"#22c55e",grd:"#0d2918",grb:"#1d4d2a",
  rd:"#ef4444",rdd:"#1c0808",rdb:"#dc2626",
  am:"#f59e0b",amd:"#1f1208",
  bl:"#3b82f6",bld:"#0a1628",
  pu:"#a855f7",pud:"#180e24",
};

// ── Helpers ──────────────────────────────────────────────────────
function pipSz(p){const u=(p||"").toUpperCase();if(u.includes("XAU")||u.includes("GOLD"))return 0.01;if(u.endsWith("JPY"))return 0.01;return 0.0001;}
function pipVl(p,l){const u=(p||"").toUpperCase();const v=parseFloat(l)||0.01;if(u.includes("XAU")||u.includes("GOLD"))return v*100;if(u.endsWith("JPY"))return v*1000;return v*10;}
function doPnL(pair,dir,en,ex,lot){
  if(!en||!ex)return{pnl:0,pips:0};
  const ps=pipSz(pair),pv=pipVl(pair,lot),raw=dir==="BUY"?(ex-en):(en-ex),pips=raw/ps;
  return{pnl:pips*pv,pips};
}
function getIST(){
  const n=new Date(),ist=new Date(n.getTime()+5.5*60*60*1000),pad=x=>String(x).padStart(2,"0");
  return{
    full:`${pad(ist.getUTCDate())} ${MO[ist.getUTCMonth()]} ${ist.getUTCFullYear()} — ${pad(ist.getUTCHours())}:${pad(ist.getUTCMinutes())}:${pad(ist.getUTCSeconds())} IST`,
    date:`${ist.getUTCFullYear()}-${pad(ist.getUTCMonth()+1)}-${pad(ist.getUTCDate())}`,
    time:`${pad(ist.getUTCHours())}:${pad(ist.getUTCMinutes())}:${pad(ist.getUTCSeconds())}`,
  };
}
function fmt(n,pre=2){return(parseFloat(n)||0).toFixed(pre);}
function sign(n){return parseFloat(n)>=0?"+":" ";}

// ── Shared tiny components ───────────────────────────────────────
function Lbl({t}){return <label style={{fontSize:11,color:K.tx3,fontFamily:"monospace",letterSpacing:".06em",textTransform:"uppercase",display:"block",marginBottom:4}}>{t}</label>;}
function Fld({label,children}){return <div style={{display:"flex",flexDirection:"column"}}><Lbl t={label}/>{children}</div>;}
function Sec({t}){return <div style={{fontFamily:"monospace",fontSize:9,fontWeight:700,color:K.tx3,textTransform:"uppercase",letterSpacing:".15em",marginTop:20,marginBottom:8,borderBottom:`1px solid ${K.bd}`,paddingBottom:6}}>{t}</div>;}

function Tog({label,active,col,onClick}){
  const cols={G:{border:`1px solid ${K.gr}`,background:K.grd,color:K.gr},R:{border:`1px solid ${K.rd}`,background:K.rdd,color:K.rd},A:{border:`1px solid ${K.am}`,background:K.amd,color:K.am},P:{border:`1px solid ${K.pu}`,background:K.pud,color:K.pu},B:{border:`1px solid ${K.bl}`,background:K.bld,color:K.bl}};
  const base={padding:"7px 13px",borderRadius:6,fontSize:12,fontFamily:"monospace",cursor:"pointer",userSelect:"none",border:`1px solid ${K.bd}`,background:K.bg3,color:K.tx2};
  return <div style={{...base,...(active?cols[col]||cols.B:{})}} onClick={onClick}>{label}</div>;
}

function Btn({label,onClick,variant="def",disabled,full}){
  const vs={def:{background:"transparent",border:`1px solid ${K.bd2}`,color:K.tx2},pri:{background:K.gr,border:`1px solid ${K.gr}`,color:"#000"},pur:{background:K.pud,border:`1px solid ${K.pu}`,color:K.pu},dan:{background:"transparent",border:`1px solid ${K.rdb}`,color:K.rd}};
  return <button onClick={onClick} disabled={disabled} style={{...vs[variant]||vs.def,padding:"10px 20px",fontSize:12,width:full?"100%":"auto"}}>{label}</button>;
}

function CheckRow({rule,checked,onToggle}){
  const bg=checked?(rule.w?K.amd:K.grd):K.bg3;
  const bd=checked?(rule.w?"#4d2e0a":K.grb):K.bd;
  const cbBg=checked?(rule.w?K.am:K.gr):"transparent";
  const cbBd=checked?(rule.w?K.am:K.gr):K.bd2;
  return(
    <div onClick={onToggle} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 14px",background:bg,border:`1px solid ${bd}`,borderRadius:8,marginBottom:6,cursor:"pointer",userSelect:"none"}}>
      <div style={{width:18,height:18,borderRadius:4,background:cbBg,border:`1.5px solid ${cbBd}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
        {checked&&<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#000" strokeWidth="2.5"><polyline points="2,6 5,9 10,3"/></svg>}
      </div>
      <span style={{flex:1,fontSize:13,color:checked?K.tx:K.tx2}}>{rule.t}</span>
      <span style={{fontSize:9,fontFamily:"monospace",color:K.tx3,background:K.bg4,padding:"2px 6px",borderRadius:3}}>{rule.c}</span>
    </div>
  );
}

function StatChip({label,value,color}){
  return(
    <div style={{display:"flex",flexDirection:"column",gap:2}}>
      <span style={{fontFamily:"monospace",fontSize:9,color:K.tx3,textTransform:"uppercase",letterSpacing:".1em"}}>{label}</span>
      <span style={{fontFamily:"monospace",fontSize:15,fontWeight:700,color:color||K.tx}}>{value}</span>
    </div>
  );
}

// ── Toast hook ───────────────────────────────────────────────────
function useToast(){
  const [msg,setMsg]=useState("");
  function show(m){setMsg(m);setTimeout(()=>setMsg(""),3200);}
  return[msg,show];
}

// ── Main App ─────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("setup");
  const [clock,setClock]=useState(getIST().full);
  const [sheetUrl,setSheetUrl]=useState(()=>localStorage.getItem("tj_url")||"");
  const [connMsg,setConnMsg]=useState({t:"",ok:false});
  const [toastMsg,showToast]=useToast();
  const [localLog,setLocalLog]=useState(()=>JSON.parse(localStorage.getItem("tj_log")||"[]"));
  const [dayTrades,setDayTrades]=useState(()=>JSON.parse(localStorage.getItem("tj_day")||"[]"));
  const [balance,setBalance]=useState(()=>localStorage.getItem("tj_bal")||"10000");
  const [showEOD,setShowEOD]=useState(false);
  const [eodNotes,setEodNotes]=useState("");

  // Setup fields
  const [pair,setPair]=useState("");
  const [orderType,setOrderType]=useState("");
  const [lotSize,setLotSize]=useState("");
  const [dir,setDir]=useState("");
  const [bias,setBias]=useState("");
  const [sessions,setSessions]=useState([]);
  const [tfs,setTfs]=useState([]);
  const [strat,setStrat]=useState("");
  const [sEntry,setSEntry]=useState("");
  const [sSL,setSSL]=useState("");
  const [sTP,setSTP]=useState("");
  const [preNotes,setPreNotes]=useState("");

  // Checklist
  const [checks,setChecks]=useState(Array(11).fill(false));
  const [override,setOverride]=useState("");

  // Result
  const [outcome,setOutcome]=useState("");
  const [rEntry,setREntry]=useState("");
  const [rExit,setRExit]=useState("");
  const [rPnl,setRPnl]=useState("");
  const [rPips,setRPips]=useState("");
  const [rRR,setRRR]=useState("");
  const [rPipLbl,setRPipLbl]=useState("");
  const [exitType,setExitType]=useState("");
  const [slip,setSlip]=useState("");
  const [postNotes,setPostNotes]=useState("");
  // RF
  const [rfEnt,setRfEnt]=useState("");
  const [rfEx1,setRfEx1]=useState("");
  const [rfLt1,setRfLt1]=useState("");
  const [rfPnl1,setRfPnl1]=useState("");
  const [rfEx2,setRfEx2]=useState("");
  const [rfEx2T,setRfEx2T]=useState("");
  const [rfLt2,setRfLt2]=useState("");
  const [rfPnl2,setRfPnl2]=useState("");
  const [rfTotal,setRfTotal]=useState("");
  const [rfPips,setRfPips]=useState("");
  const [rfRR,setRfRR]=useState("");
  // AI
  const [aiText,setAiText]=useState("Fill the result above then click Analyse.");
  const [aiDone,setAiDone]=useState(false);
  const [aiLoad,setAiLoad]=useState(false);

  // Clock
  useEffect(()=>{const t=setInterval(()=>setClock(getIST().full),1000);return()=>clearInterval(t);},[]);
  // Persist
  useEffect(()=>{localStorage.setItem("tj_url",sheetUrl);},[sheetUrl]);
  useEffect(()=>{localStorage.setItem("tj_bal",balance);},[balance]);
  useEffect(()=>{localStorage.setItem("tj_log",JSON.stringify(localLog));},[localLog]);
  useEffect(()=>{localStorage.setItem("tj_day",JSON.stringify(dayTrades));},[dayTrades]);

  // ── Daily stats ────────────────────────────────────────────────
  const today=getIST().date;
  // Filter dayTrades to only today (auto-reset if new day)
  const todayT=dayTrades.filter(t=>t.date===today);
  const dayPnl=todayT.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const dayPips=todayT.reduce((s,t)=>s+(parseFloat(t.pips)||0),0);
  const dayWins=todayT.filter(t=>t.outcome==="Win").length;
  const dayLoss=todayT.filter(t=>t.outcome==="Loss").length;
  const bal=parseFloat(balance)||10000;
  const dayPct=(dayPnl/bal)*100;
  const dpCol=dayPnl>0?K.gr:dayPnl<0?K.rd:K.am;

  // ── Checklist score ────────────────────────────────────────────
  const score=checks.filter(Boolean).length;
  const vrd=score>=9?"Perfect trade":score>=6?"Trade with caution":"Do not trade";
  const vrdCol=score>=9?K.gr:score>=6?K.am:K.rd;

  // ── Toggle helpers ─────────────────────────────────────────────
  function toggleSess(s){setSessions(p=>p.includes(s)?p.filter(x=>x!==s):[...p,s]);}
  function toggleTF(t){setTfs(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t]);}
  function toggleChk(i){setChecks(p=>{const n=[...p];n[i]=!n[i];return n;});}

  // ── P&L calculation ────────────────────────────────────────────
  function calcStd(ent,ext){
    const en=parseFloat(ent)||parseFloat(sEntry)||0,ex=parseFloat(ext)||0,lt=parseFloat(lotSize)||0.01,sl=parseFloat(sSL)||0;
    if(!en||!ex)return;
    const{pnl,pips}=doPnL(pair,dir,en,ex,lt);
    setRPnl(pnl.toFixed(2));setRPips(pips.toFixed(2));
    const pu=(pair||"").toUpperCase();
    setRPipLbl(pu.includes("XAU")?"Gold — $0.01/pip":pu.endsWith("JPY")?"JPY — 0.01/pip":"Forex — 0.0001/pip");
    if(sl&&en){const ps=pipSz(pair),sp=Math.abs(en-sl)/ps;setRRR(sp>0?Math.abs(pips/sp).toFixed(2):"");}
  }
  function calcRF(f,v){
    const en=parseFloat(f==="rfEnt"?v:rfEnt)||parseFloat(sEntry)||0;
    const ex1=parseFloat(f==="rfEx1"?v:rfEx1)||0,lt1=parseFloat(f==="rfLt1"?v:rfLt1)||0;
    const ex2=parseFloat(f==="rfEx2"?v:rfEx2)||0,totLot=parseFloat(lotSize)||0.01,sl=parseFloat(sSL)||0;
    if(!en)return;
    let p1=0,pi1=0,p2=0,pi2=0;
    if(ex1&&lt1){const r=doPnL(pair,dir,en,ex1,lt1);p1=r.pnl;pi1=r.pips;setRfPnl1(p1.toFixed(2));}
    const l2=Math.max(0,totLot-lt1);setRfLt2(l2.toFixed(2));
    if(ex2&&l2){const r=doPnL(pair,dir,en,ex2,l2);p2=r.pnl;pi2=r.pips;setRfPnl2(p2.toFixed(2));}
    const tot=p1+p2,avgP=lt1&&l2?(pi1*lt1+pi2*l2)/totLot:(pi1||pi2);
    setRfTotal(tot.toFixed(2));setRfPips(avgP.toFixed(2));
    if(sl&&en){const ps=pipSz(pair),sp=Math.abs(en-sl)/ps;setRfRR(sp>0?Math.abs(avgP/sp).toFixed(2):"");}
  }

  const isRF=outcome==="Risk Free";
  const dPnl=isRF?parseFloat(rfTotal)||0:parseFloat(rPnl)||0;
  const dPips=isRF?rfPips:rPips;
  const dRR=isRF?rfRR:rRR;

  // ── Build payload ──────────────────────────────────────────────
  function buildPayload(){
    const ist=getIST();
    const p={type:"trade",date:ist.date,timeIST:ist.time,pair,direction:dir,bias,orderType,lotSize,sessions:sessions.join(", "),timeframes:tfs.join(", "),strategy:strat,sEntry,sSL,sTP,preNotes,checklistScore:score+"/11",verdict:vrd,overrideReason:override,outcome,actualEntry:isRF?rfEnt:rEntry,exit1:isRF?rfEx1:rExit,exit2:isRF?rfEx2:"",lots1:isRF?rfLt1:lotSize,lots2:isRF?rfLt2:"",pnl:isRF?rfTotal:rPnl,pips:isRF?rfPips:rPips,rr:isRF?rfRR:rRR,exitType,slippage:slip,postNotes,aiInsights:aiText};
    RULES.forEach((_,i)=>{p["c"+i]=checks[i]?"YES":"NO";});
    return p;
  }

  // ── AI analyse ─────────────────────────────────────────────────
  async function analyse(){
    setAiLoad(true);setAiText("Analysing your trade...");
    const failed=RULES.filter((_,i)=>!checks[i]).map(r=>r.t);
    const rfD=isRF?`\nH1: exit ${rfEx1}, lots ${rfLt1}, P&L $${rfPnl1}\nH2: exit ${rfEx2} (${rfEx2T}), lots ${rfLt2}, P&L $${rfPnl2}`:"";
    const prompt=`You are a professional forex and gold (XAU/USD) trading coach. Be sharp and specific.

TRADE: ${pair||"Unknown"} | ${dir} | Bias: ${bias} | Strategy: ${strat}
Sessions: ${sessions.join(",")||"—"} | TFs: ${tfs.join(",")||"—"}
Planned: Entry ${sEntry} | SL ${sSL} | TP ${sTP}
Actual: Entry ${isRF?rfEnt:rEntry} | Exit: ${isRF?rfEx1+" (H1), "+rfEx2+" (H2)":rExit}
P&L: $${isRF?rfTotal:rPnl} | Pips: ${isRF?rfPips:rPips} | R:R: ${isRF?rfRR:rRR}
Outcome: ${outcome}${rfD}
Exit: ${exitType} | Slippage: ${slip} pips
Checklist: ${score}/11 — ${vrd}
Failed rules: ${failed.length?failed.join(", "):"None — all passed"}
${override?"Override reason: "+override:""}
Pre notes: ${preNotes||"—"} | Post notes: ${postNotes||"—"}
Day so far: ${todayT.length} trades | P&L $${dayPnl.toFixed(2)} (${dayPct.toFixed(2)}%)

Respond in this exact format:

EXECUTION QUALITY: [1-2 sentences]

WHAT YOU DID WELL:
- [specific point]
- [specific point]

AREAS TO IMPROVE:
- [specific actionable point]
- [specific actionable point]

KEY INSIGHT: [the single most important lesson from this trade]

NEXT TRADE ADVICE: [what to focus on for the next setup on ${pair||"this pair"}]`;
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:900,messages:[{role:"user",content:prompt}]})
      });
      const data=await res.json();
      setAiText(data.content?.[0]?.text||"No analysis returned.");
      setAiDone(true);showToast("✓ Analysis complete — review then log");
    }catch(e){
      setAiText("⚠ AI Error: "+e.message+"\n\nIf you opened this file directly (file://) the browser blocks API calls.\n\nFix: Use your Netlify URL instead — https://your-site.netlify.app\n\nIf already on Netlify, check your internet connection.");
      setAiDone(true);
    }
    setAiLoad(false);
  }

  // ── Log trade ──────────────────────────────────────────────────
  async function logTrade(){
    const url=sheetUrl.trim(),payload=buildPayload();
    if(url) await sendToSheets(url, payload);
    const entry={...payload,pnl:isRF?rfTotal:rPnl,pips:isRF?rfPips:rPips,outcome,date:getIST().date};
    setLocalLog(p=>{const n=[...p,payload];localStorage.setItem("tj_log",JSON.stringify(n));return n;});
    setDayTrades(p=>{const n=[...p,entry];localStorage.setItem("tj_day",JSON.stringify(n));return n;});
    showToast("✓ Trade logged"+(url?" + sent to Sheets":"— add Sheets URL to sync"));
    resetForm();
  }

  // ── Send to Sheets helper (POST no-cors + GET fallback) ──────────
  async function sendToSheets(url, payload){
    // Try POST with no-cors first
    try{
      await fetch(url,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)});
      return true;
    }catch(e){}
    // Fallback: GET with URL-encoded payload (handles some CORS edge cases)
    try{
      const encoded=encodeURIComponent(JSON.stringify(payload));
      if(url.length+encoded.length < 7000){
        await fetch(url+"?payload="+encoded,{mode:"no-cors"});
        return true;
      }
    }catch(e){}
    return false;
  }

  // ── End of day ─────────────────────────────────────────────────
  async function endDay(){
    if(!todayT.length){showToast("No trades today to summarise");return;}
    const url=sheetUrl.trim();
    const allPnls=todayT.map(t=>parseFloat(t.pnl)||0);
    const newBalance=(bal+dayPnl).toFixed(2);
    const eod={type:"eod",date:today,totalTrades:todayT.length,wins:dayWins,losses:dayLoss,
      breakevens:todayT.filter(t=>t.outcome==="Breakeven").length,
      riskFree:todayT.filter(t=>t.outcome==="Risk Free").length,
      totalPnl:dayPnl.toFixed(2),totalPct:dayPct.toFixed(2)+"%",totalPips:dayPips.toFixed(2),
      avgRR:(todayT.reduce((s,t)=>s+(parseFloat(t.rr)||0),0)/Math.max(1,todayT.length)).toFixed(2),
      bestTrade:Math.max(...allPnls).toFixed(2),worstTrade:Math.min(...allPnls).toFixed(2),
      balanceAfter:newBalance,pairsTraded:[...new Set(todayT.map(t=>t.pair))].join(", "),eodNotes};
    if(url) await sendToSheets(url, eod);
    setLocalLog(p=>{const n=[...p,eod];localStorage.setItem("tj_log",JSON.stringify(n));return n;});
    // ── FIX: reset day trades + update balance to carry forward ──
    setDayTrades([]);
    localStorage.removeItem("tj_day");
    setBalance(newBalance);
    localStorage.setItem("tj_bal", newBalance);
    setShowEOD(false);setEodNotes("");
    showToast("✓ Day summary logged to Sheets! Balance updated to $"+newBalance);
  }

    setRfEnt("");setRfEx1("");setRfLt1("");setRfPnl1("");setRfEx2("");setRfEx2T("");setRfLt2("");setRfPnl2("");setRfTotal("");setRfPips("");setRfRR("");

    setTab("setup");
  }

            </div>

        )}

                    </thead>
                    <tbody>
                      {[...localLog.filter(t=>t.type==="eod")].reverse().map((t,i)=>{
                        const pnl=parseFloat(t.totalPnl)||0;
                        const col=pnl>0?K.gr:pnl<0?K.rd:K.am;
                        return(
                          <tr key={i} style={{borderBottom:`1px solid ${K.bd}`}}>
                            {[
                              [t.date,K.tx],[""+t.totalTrades,K.tx2],[t.wins,K.gr],[t.losses,K.rd],
                              [(pnl>=0?"+":"")+"$"+pnl.toFixed(2),col],[t.totalPct,col],[t.totalPips,K.tx2],[t.avgRR,K.tx2],
                              ["$"+t.bestTrade,K.gr],["$"+t.worstTrade,K.rd],["$"+t.balanceAfter,col]
                            ].map(([v,c],j)=>(
                              <td key={j} style={{padding:"9px 12px",color:c,whiteSpace:"nowrap"}}>{v}</td>
                            ))}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </>
            )}
          </div>
        )}

        {/* ════ SCRIPT ═══════════════════════════════════════════ */}
        {tab==="script"&&(
          <div>
            <Sec t="Paste into Google Sheet → Extensions → Apps Script"/>
            <div style={{background:K.bg2,border:`1px solid ${K.bd}`,borderRadius:10,padding:14,fontFamily:"monospace",fontSize:10,color:K.tx2,lineHeight:1.7,whiteSpace:"pre-wrap",overflowX:"auto",maxHeight:300,overflowY:"auto"}}>
              {SCRIPT}
            </div>
            <div style={{display:"flex",gap:10,marginTop:12}}>
              <Btn label="Copy Script" onClick={()=>navigator.clipboard.writeText(SCRIPT).then(()=>showToast("Script copied!"))}/>
            </div>
            <div style={{marginTop:16,fontFamily:"monospace",fontSize:11,color:K.tx3,lineHeight:2,background:K.bg2,border:`1px solid ${K.bd}`,borderRadius:10,padding:16}}>
              <strong style={{color:K.tx2}}>Setup steps:</strong><br/>
              1. Open your Google Sheet → Extensions → Apps Script<br/>
              2. Delete default code → paste the script above → Ctrl+S to save<br/>
              3. Click Deploy → New deployment → Web app<br/>
              4. Execute as: <strong style={{color:K.tx}}>Me</strong> | Who has access: <strong style={{color:K.tx}}>Anyone</strong><br/>
              5. Click Deploy → Authorise when prompted<br/>
              6. Copy the Web App URL (starts with /macros/s/)<br/>
              7. Paste it in the config box above → done<br/><br/>
              <strong style={{color:K.tx2}}>Sheets created automatically:</strong><br/>
              • <strong style={{color:K.gr}}>TradeJournal</strong> — one row per individual trade<br/>
              • <strong style={{color:K.pu}}>DailySummary</strong> — one row per day (End Day button)<br/><br/>
              <strong style={{color:K.am}}>Note:</strong> Local log persists in browser storage even without Sheets connected.
            </div>
          </div>
        )}
      </div>

      {/* ════ EOD Modal ════════════════════════════════════════════ */}
      {showEOD&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.82)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}
          onClick={e=>{if(e.target===e.currentTarget)setShowEOD(false);}}>
          <div style={{background:K.bg2,border:`1px solid ${K.bd2}`,borderRadius:14,padding:26,maxWidth:520,width:"100%",maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{fontFamily:"monospace",fontSize:14,fontWeight:700,color:K.tx,marginBottom:20,letterSpacing:".04em"}}>End of Day — {today}</div>

            {/* Big 3 stats */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
              {[["Total P&L",(dayPnl>=0?"+":"")+"$"+dayPnl.toFixed(2),dpCol],["Return",(dayPct>=0?"+":"")+dayPct.toFixed(2)+"%",dpCol],["Total Pips",(dayPips>=0?"+":"")+dayPips.toFixed(1),dpCol]].map(([l,v,col])=>(
                <div key={l} style={{background:K.bg3,border:`1px solid ${K.bd}`,borderRadius:8,padding:14,textAlign:"center"}}>
                  <div style={{fontFamily:"monospace",fontSize:9,color:K.tx3,textTransform:"uppercase",letterSpacing:".1em",marginBottom:6}}>{l}</div>
                  <div style={{fontFamily:"monospace",fontSize:22,fontWeight:700,color:col}}>{v}</div>
                </div>
              ))}
            </div>

            {/* 4 smaller stats */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:14}}>
              {[["Trades",""+todayT.length,K.tx],["Wins",""+dayWins,K.gr],["Losses",""+dayLoss,K.rd],["Bal After","$"+(bal+dayPnl).toFixed(2),dpCol]].map(([l,v,col])=>(
                <div key={l} style={{background:K.bg3,border:`1px solid ${K.bd}`,borderRadius:8,padding:"10px 8px",textAlign:"center"}}>
                  <div style={{fontFamily:"monospace",fontSize:9,color:K.tx3,textTransform:"uppercase",letterSpacing:".1em",marginBottom:4}}>{l}</div>
                  <div style={{fontFamily:"monospace",fontSize:14,fontWeight:700,color:col}}>{v}</div>
                </div>
              ))}
            </div>

            {/* Trade list */}
            {todayT.length>0&&(
              <div style={{marginBottom:14}}>
                <div style={{fontFamily:"monospace",fontSize:9,color:K.tx3,textTransform:"uppercase",letterSpacing:".1em",marginBottom:8}}>Trades Today</div>
                {todayT.map((t,i)=>{
                  const pnl=parseFloat(t.pnl)||0;
                  const col=pnl>0?K.gr:pnl<0?K.rd:K.am;
                  return(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:K.bg3,border:`1px solid ${K.bd}`,borderRadius:6,marginBottom:5,fontFamily:"monospace",fontSize:11}}>
                      <span style={{color:K.tx,minWidth:70}}>{t.pair||"—"}</span>
                      <span style={{color:t.direction==="BUY"?K.gr:K.rd,minWidth:40}}>{t.direction}</span>
                      <span style={{color:K.tx2,minWidth:60}}>{t.pips} pips</span>
                      <span style={{color:col,minWidth:70}}>{pnl>=0?"+":""}${pnl.toFixed(2)}</span>
                      <span style={{color:col}}>{t.outcome}</span>
                    </div>
                  );
                })}
              </div>
            )}

            <Fld label="End of Day Notes (optional)">
              <textarea value={eodNotes} onChange={e=>setEodNotes(e.target.value)} placeholder="Session notes, key lessons, what to work on tomorrow..."/>
            </Fld>

            <div style={{display:"flex",gap:10,marginTop:16}}>
              <Btn label="Cancel" onClick={()=>setShowEOD(false)}/>
              <Btn label="Confirm — Log Day to Sheets" variant="pri" onClick={endDay}/>
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      {toastMsg&&(
        <div style={{position:"fixed",bottom:22,right:22,background:K.bg4,border:`1px solid ${K.bd2}`,borderRadius:8,padding:"12px 18px",fontFamily:"monospace",fontSize:12,color:K.tx,zIndex:200,pointerEvents:"none",boxShadow:"0 4px 24px rgba(0,0,0,.5)"}}>
          {toastMsg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
